<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Fitness Coach · MIS</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, "Segoe UI", Arial, sans-serif; background: #EEF3F9; color: #1E2A3A; }
  header { background: #16325C; color: #fff; padding: 14px 24px; border-bottom: 5px solid #F28C28; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 26px; }
  main { display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
  .stage { position: relative; background: #0E1A2C; border-radius: 16px; overflow: hidden; width: 640px; max-width: 100%; aspect-ratio: 4 / 3; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); } /* mirror like a selfie */
  video { opacity: 0.35; }
  .counter { position: absolute; top: 14px; left: 14px; background: #16325C; color: #fff; border-radius: 12px; padding: 8px 18px; text-align: center; }
  .counter small { display: block; color: #9FD8DF; font-weight: 700; letter-spacing: 1px; }
  .counter b { font-size: 40px; }
  .panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border-radius: 16px; padding: 16px 20px; border: 2px solid #D5DEEA; }
  .card h2 { margin: 0 0 6px; font-size: 22px; }
  .card p { margin: 0; color: #55657A; }
  .good { border-color: #2BB673; background: #E8F7EE; } .good h2 { color: #2BB673; }
  .warn { border-color: #F28C28; background: #FFF4E5; } .warn h2 { color: #F28C28; }
  button { font: inherit; font-weight: 700; padding: 12px 18px; border: 0; border-radius: 999px; background: #0FA3B1; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #16325C; border: 2px solid #16325C; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #status { color: #55657A; }
</style>
</head>
<body>
<header><h1>AI Fitness Coach</h1><span>Squat counter · MIS ICT</span></header>

<main>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="counter"><small>SQUATS</small><b id="reps">0</b></div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="startBtn">Start camera</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <label><input type="checkbox" id="voice" checked> Voice feedback</label>
    </div>
    <p id="status">Click "Start camera". Stand side-on, 2–3 metres away, with your whole body in view.</p>
    <div id="depthCard" class="card"><h2>Depth</h2><p>Waiting for a squat…</p></div>
    <div id="backCard" class="card"><h2>Back</h2><p>Waiting for a squat…</p></div>
    <div class="card"><h2 style="color:#16325C">Live angles</h2><p id="angles">Knee: –   ·   Back: –</p></div>
    <div class="card"><h2 style="color:#16325C">Session summary</h2><p id="summary">0 reps · 0% good form</p></div>
  </div>
</main>

<script type="module">
// ===== PART 1: Load the AI pose model (MediaPipe Pose Landmarker, 33 body points) =====
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "./vision_bundle.mjs";   // library saved inside this folder

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const draw = new DrawingUtils(ctx);
const $ = id => document.getElementById(id);

// ===== Settings students can tune after testing =====
const DOWN_KNEE = 100;   // knee angle below this = squatting down
const UP_KNEE = 160;     // knee angle above this = standing up again
const MIN_BACK = 60;     // back angle from the floor; below this = leaning too far forward

let landmarker, reps = 0, goodReps = 0, phase = "up", minKnee = 180, minBack = 90, wentDeep = false;

// All files load from THIS website first, so school firewalls don't block them.
const LOCAL_MODEL = "./models/pose_landmarker_lite.task";
const GOOGLE_MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

async function tryCreate(vision, modelPath, delegate) {
  return PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: modelPath, delegate },
    runningMode: "VIDEO",
    numPoses: 1
  });
}

async function loadModel() {
  $("status").textContent = "Loading the AI model… (first time can take 10–20 seconds)";
  const vision = await FilesetResolver.forVisionTasks("./wasm");
  const local = await fetch(LOCAL_MODEL, { method: "HEAD" }).then(r => r.ok).catch(() => false);
  const model = local ? LOCAL_MODEL : GOOGLE_MODEL;
  try {
    landmarker = await tryCreate(vision, model, "GPU");
  } catch (e) {
    try {
      landmarker = await tryCreate(vision, model, "CPU");   // some school laptops have no GPU support
    } catch (e2) {
      throw new Error(local ? "The model file in /models could not be opened. Re-upload pose_landmarker_lite.task."
                            : "Could not download the AI model. Put pose_landmarker_lite.task inside the models folder (see README).");
    }
  }
}

// ===== PART 2: Start the webcam =====
async function startCamera() {
  if (!landmarker) await loadModel();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  } catch (e) {
    throw new Error("Camera blocked. Click the camera icon in Chrome's address bar and choose Allow.");
  }
  video.srcObject = stream;
  await video.play();
  $("status").textContent = "Camera on. Do a squat!";
  requestAnimationFrame(loop);
}

// ===== PART 3: Maths: the angle at point b, made by points a-b-c (in degrees) =====
function angle(a, b, c) {
  const ab = Math.atan2(a.y - b.y, a.x - b.x);
  const cb = Math.atan2(c.y - b.y, c.x - b.x);
  let deg = Math.abs((ab - cb) * 180 / Math.PI);
  return deg > 180 ? 360 - deg : deg;
}
// Back angle = how upright the body is (90° = straight up, 0° = flat)
function backAngle(shoulder, hip) {
  const dx = Math.abs(shoulder.x - hip.x), dy = Math.abs(shoulder.y - hip.y);
  return Math.atan2(dy, dx) * 180 / Math.PI;
}

function say(text) {
  if (!$("voice").checked) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

function setCard(id, cls, title, text) {
  const c = $(id);
  c.className = "card " + cls;
  c.innerHTML = `<h2>${title}</h2><p>${text}</p>`;
}

// ===== PART 4: The main loop: detect pose → measure → count → give feedback =====
function loop() {
  const result = landmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (result.landmarks.length > 0) {
    const p = result.landmarks[0];
    // Draw the skeleton
    draw.drawConnectors(p, PoseLandmarker.POSE_CONNECTIONS, { color: "#0FA3B1", lineWidth: 5 });
    draw.drawLandmarks(p, { color: "#F28C28", radius: 5 });

    // Use the side of the body the camera sees best (left = 11,23,25,27 / right = 12,24,26,28)
    const left = p[23].visibility + p[25].visibility + p[27].visibility;
    const right = p[24].visibility + p[26].visibility + p[28].visibility;
    const [s, h, k, a] = left >= right ? [p[11], p[23], p[25], p[27]] : [p[12], p[24], p[26], p[28]];

    const knee = Math.round(angle(h, k, a));
    const back = Math.round(backAngle(s, h));
    $("angles").textContent = `Knee: ${knee}°   ·   Back: ${back}°`;

    // Rep counter (a simple state machine: up → down → up = 1 rep)
    if (phase === "up" && knee < DOWN_KNEE) { phase = "down"; minKnee = knee; minBack = back; wentDeep = false; }
    if (phase === "down") {
      minKnee = Math.min(minKnee, knee);
      minBack = Math.min(minBack, back);
      if (h.y >= k.y) wentDeep = true;          // hip below knee level (y grows downwards)
      if (knee > UP_KNEE) {                      // back up: one rep finished
        phase = "up";
        reps++;
        const goodDepth = wentDeep, goodBack = minBack >= MIN_BACK;
        if (goodDepth && goodBack) goodReps++;
        $("reps").textContent = reps;
        setCard("depthCard", goodDepth ? "good" : "warn", goodDepth ? "Good depth" : "Go a little lower",
                goodDepth ? "Hips below knee level" : `Lowest knee angle ${minKnee}°`);
        setCard("backCard", goodBack ? "good" : "warn", goodBack ? "Back looks good" : "Keep your back straight",
                `Back angle ${minBack}° (target over ${MIN_BACK}°)`);
        say(goodBack ? (goodDepth ? `${reps}. Good` : `${reps}. Go lower`) : `${reps}. Back straight`);
        $("summary").textContent = `${reps} reps · ${Math.round(goodReps / reps * 100)}% good form`;
      }
    }
  }
  requestAnimationFrame(loop);
}

$("startBtn").onclick = () => startCamera().catch(e => { $("status").textContent = "Error: " + e.message; $("status").style.color = "#E5484D"; });
$("resetBtn").onclick = () => {
  reps = goodReps = 0; phase = "up";
  $("reps").textContent = 0; $("summary").textContent = "0 reps · 0% good form";
};
</script>
</body>
</html>
